<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline — Portal App</title>
    <style>
        body { font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f3f4f6; }
        .offline-card { text-align: center; padding: 2rem; background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .icon { font-size: 4rem; }
        h1 { font-size: 1.5rem; margin: 1rem 0; }
        p { color: #6b7280; }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="icon">📡</div>
        <h1>Koneksi Terputus</h1>
        <p>Aplikasi akan melanjutkan secara otomatis<br>saat koneksi internet pulih.</p>
        <p class="hint">Data yang sudah tersimpan tetap dapat diakses.</p>
    </div>
</body>
</html>
